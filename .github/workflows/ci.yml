name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

      # DESIGN.md §6.5 — the TS client is generated from the Rust DTOs.
      # Regeneration ran as part of the Tests step (ts-rs exports during
      # `cargo test`); any diff means a hand edit or a wire change that was
      # never regenerated, and must fail the build instead of drifting.
      # Ubuntu only: Windows checkout would rewrite line endings and turn
      # every file into a diff.
      - name: TS bindings in sync
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- apps/web/src/lib/schema

      # ARCHITECTURE.md §2 — dependency direction.
      - name: Architecture
        run: cargo test --test architecture

      # ARCHITECTURE.md §1 — every invariant is gated here, not in nightly.
      - name: Invariants I1-I10
        run: cargo test --test invariants

      # Invariant I4 — the pure core must stay pure and wasm-compatible.
      - name: Pure core compiles to wasm32
        run: cargo check --target wasm32-unknown-unknown -p dit-model -p dit-parse -p dit-query -p dit-wasm

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # DESIGN.md §12.4 — reject GPL/proprietary JS packages.
      - run: node scripts/check-js-licenses.mjs

  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # The UI build embeds the editor's WASM bridge (ADR 0011) — the web
      # app's own guard fails the build when it is missing.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build crates/dit-wasm --target web --out-name dit_wasm --no-pack --out-dir ../../apps/web/src/editor/wasm
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
      # ADR 0003 — the bundle is part of the install, so it is budgeted.
      - run: node scripts/check-bundle-size.mjs

  # The UI is built here, at release time — never committed. See DESIGN.md §8:
  # the same reasoning that rejected committing the snapshot index. Each target
  # lands as dit-<target>.tar.gz on the tagged release, which is what
  # scripts/install.sh downloads.
  release-artifact:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # The UI embeds the editor's WASM bridge (ADR 0011); build it before
      # the web app, which refuses to bundle without it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build crates/dit-wasm --target web --out-name dit_wasm --no-pack --out-dir ../../apps/web/src/editor/wasm
      - run: npm ci --prefix apps/web && npm run build --prefix apps/web
      - run: cargo build --release --locked --features embed-ui -p dit-cli --target ${{ matrix.target }}
      - run: tar -czf dit-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release dit
      - uses: softprops/action-gh-release@v2
        with:
          files: dit-${{ matrix.target }}.tar.gz
