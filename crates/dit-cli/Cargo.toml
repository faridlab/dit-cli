[package]
name    = "dit-cli"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[features]
# Serves the built web UI from inside the binary. Release builds want this;
# dev builds leave it off so the frontend dev server owns the browser side.
embed-ui = ["dit-server/embed-ui"]

[lints]
workspace = true

[dependencies]
dit-core = { workspace = true }
dit-server = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "dit"
path = "src/main.rs"
