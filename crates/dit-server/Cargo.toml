[package]
name    = "dit-server"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Release builds embed the built UI into the binary (one file, no install).
# Dev builds omit it, so `cargo run` never requires a Node toolchain and
# `npm run dev` never requires rebuilding Rust. Same repo, independent loops.
default = []
embed-ui = ["dep:rust-embed"]

[dependencies]
dit-core = { workspace = true }
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true }
futures-util = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
rust-embed = { workspace = true, optional = true }
# `no-serde-warnings`: ts-rs ignores serde attributes it does not model
# (`deserialize_with` on the tri-state patch fields) and would otherwise emit
# a compile warning per field, which `-D warnings` turns red.
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }

[dev-dependencies]
tempfile = { workspace = true }
# Tests read response bodies through the http-body trait; this is the tiny
# reader the hyper project ships for exactly that, kept out of the server.
http-body-util = "0.1"

[[bin]]
name = "dit-server"
path = "src/main.rs"

[lib]
name = "dit_server"
path = "src/lib.rs"
