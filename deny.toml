[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # notify (the watcher, ADR 0017) is MIT OR Apache-2.0 OR CC0-1.0; the
    # expression as a whole needs every arm allowed. CC0 is a permissive
    # public-domain dedication.
    "CC0-1.0",
    # webpki-roots is Mozilla's CA bundle, which entered the graph when Morse
    # started speaking HTTPS (§20.5). CDLA-Permissive-2.0 is a permissive
    # *data* licence — no copyleft and no obligation on anything downstream —
    # which fits, because what it covers is a list of certificates rather
    # than code this project links against.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Pre-1.0 crates on the critical path are pinned deliberately (DESIGN.md §9).
deny = []

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
